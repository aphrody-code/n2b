# Cargo workspace n2b — layout Turborepo-style sous `crates/*`.
#
# Layout :
#   crates/n2b-types     → schéma JSON v2 généré (cargo-typify) + types runtime
#   crates/n2b-util      → primitives partagées (line_offsets, apply_edits, make_finding)
#   crates/n2b-rules     → règles (regex / AST) — bun_apis, node_imports, cli_commands
#   crates/n2b-scanners  → scanners par type de fichier (package_json, source, ...)
#   crates/n2b-report    → renderers text / json / jsonl / markdown / sarif
#   crates/n2b-ai        → embeddings ML pour l'analyse crosslink (sous-commande `analyze`)
#   crates/n2b-github    → wrappers octocrab pour `audit`
#   crates/n2b-core      → orchestration (run, engine walk, dispatch)
#   crates/n2b-cli       → binaire `n2b` (entrée + dispatch + commands/*)
#   crates/n2b-native    → cdylib `node2bun-native` (plugin Bun, ABI v1 gelée)
#
# Le workspace virtuel permet :
#   - `cargo build --workspace` : construit tous les crates en une commande
#   - Cache `target/` unique, plus rapide entre builds
#   - Dépendances partagées via [workspace.dependencies]
#   - Profile release unique propagé à tous les members

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.metadata.groups]
n2b-libraries = [
  { path = "crates/n2b-types" },
  { path = "crates/n2b-util" },
  { path = "crates/n2b-rules" },
  { path = "crates/n2b-scanners" },
  { path = "crates/n2b-report" },
  { path = "crates/n2b-ai" },
  { path = "crates/n2b-github" },
]
n2b = [
  { path = "crates/n2b-core" },
  { path = "crates/n2b-cli" },
  { path = "crates/n2b-native" },
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/aphrody-code/n2b"
authors = ["aphrody-code <37252373+aphrody-code@users.noreply.github.com>"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
needless_borrow = "warn"
redundant_closure_for_method_calls = "warn"

[workspace.dependencies]
# Dépendances partagées entre crates — déclarer ici, inherit via `.workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
regex = "1"
once_cell = "1"
memchr = "2"
crossbeam-channel = "0.5"
toml = "0.8"

# Profile unique propagé à rust/ et native/.
# `panic = "abort"` retire le code d'unwinding (~5-10% binaire, ~3-5% perf
# sur chemins sans panique). CLI → pas besoin de recovery propre.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
incremental = false

# Profile pour dev rapide + binaire tout de même light — pour itérer sur
# les templates scaffold sans attendre une minute de link.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
