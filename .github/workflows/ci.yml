name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: bun install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: schema codegen drift
        run: bun run codegen:schema:check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: Build n2b binary
        run: cargo build --release -p n2b

      # Bun tests + baseline compare reposent sur des scripts bash et le
      # binaire `n2b` sur le PATH — Unix uniquement, le coeur Rust est déjà
      # couvert sur Windows par `cargo test`.
      - name: Install Bun
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        if: runner.os != 'Windows'
        run: bun install --frozen-lockfile

      - name: Bun tests
        if: runner.os != 'Windows'
        run: |
          export PATH="$PWD/target/release:$PATH"
          bun test packages/n2b/

      - name: Baseline compare
        if: runner.os != 'Windows'
        env:
          N2B: ${{ github.workspace }}/target/release/n2b
          RPB_ROOT: /nonexistent
        run: bash tests/compare-baseline.sh

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --locked

      - name: Smoke test
        shell: bash
        run: ./target/release/n2b --help

  ci-success:
    name: CI Success
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "lint + test + build OK"
