# ─────────────────────────────────────────────────────────────────────
# Theme infrastructure (manual — not automatable)
# ─────────────────────────────────────────────────────────────────────

theme-migration:
  packages:
    - from: "@mui/material-nextjs"
      to: "@md3-ui/core/theme"
    - from: "@emotion/react"
      to: null
    - from: "@emotion/styled"
      to: null
    - from: "@emotion/cache"
      to: null
  instructions: |
    1. Import tokens.css from @md3-ui/tokens in app/globals.css or layout.tsx
    2. Replace <AppRouterCacheProvider><ThemeProvider theme={theme}><CssBaseline />...</ThemeProvider></AppRouterCacheProvider>
       with <ThemeProvider scheme="red">...</ThemeProvider> (from @md3-ui/core/theme)
    3. Port src/lib/theme.ts to tokens.json (DTCG 3-tiers) consumed by md3-tokens-builder
    4. Remove @emotion/* from package.json (if no Tiptap usage left)

# ─────────────────────────────────────────────────────────────────────
# sx prop → className (Tailwind best-effort)
# ─────────────────────────────────────────────────────────────────────

sx-to-className:
  mappings:
    # Colors
    - { sx: "bgcolor: 'primary.main'",     class: "bg-(--md-sys-color-primary)" }
    - { sx: "bgcolor: 'secondary.main'",   class: "bg-(--md-sys-color-secondary)" }
    - { sx: "bgcolor: 'error.main'",       class: "bg-(--md-sys-color-error)" }
    - { sx: "bgcolor: 'background.paper'", class: "bg-(--md-sys-color-surface-container)" }
    - { sx: "color: 'text.primary'",       class: "text-(--md-sys-color-on-surface)" }
    - { sx: "color: 'text.secondary'",     class: "text-(--md-sys-color-on-surface-variant)" }
    - { sx: "color: 'primary.main'",       class: "text-(--md-sys-color-primary)" }

    # Spacing (sx × 8 = px)
    - { sx: "p: N",  class: "p-{N}" }
    - { sx: "pt: N", class: "pt-{N}" }
    - { sx: "pb: N", class: "pb-{N}" }
    - { sx: "pl: N", class: "pl-{N}" }
    - { sx: "pr: N", class: "pr-{N}" }
    - { sx: "px: N", class: "px-{N}" }
    - { sx: "py: N", class: "py-{N}" }
    - { sx: "m: N",  class: "m-{N}" }
    - { sx: "mt: N", class: "mt-{N}" }
    - { sx: "mb: N", class: "mb-{N}" }
    - { sx: "ml: N", class: "ml-{N}" }
    - { sx: "mr: N", class: "mr-{N}" }
    - { sx: "mx: N", class: "mx-{N}" }
    - { sx: "my: N", class: "my-{N}" }
    - { sx: "gap: N", class: "gap-{N}" }

    # Display / Flex
    - { sx: "display: 'flex'",      class: "flex" }
    - { sx: "display: 'grid'",      class: "grid" }
    - { sx: "display: 'block'",     class: "block" }
    - { sx: "display: 'none'",      class: "hidden" }
    - { sx: "flexDirection: 'row'", class: "flex-row" }
    - { sx: "flexDirection: 'column'", class: "flex-col" }
    - { sx: "alignItems: 'center'", class: "items-center" }
    - { sx: "alignItems: 'flex-start'", class: "items-start" }
    - { sx: "alignItems: 'flex-end'", class: "items-end" }
    - { sx: "justifyContent: 'center'", class: "justify-center" }
    - { sx: "justifyContent: 'space-between'", class: "justify-between" }
    - { sx: "justifyContent: 'flex-start'", class: "justify-start" }
    - { sx: "justifyContent: 'flex-end'", class: "justify-end" }
    - { sx: "flexWrap: 'wrap'", class: "flex-wrap" }

    # Sizing
    - { sx: "width: '100%'", class: "w-full" }
    - { sx: "width: N",      class: "w-{N}" }
    - { sx: "height: '100%'", class: "h-full" }
    - { sx: "height: N",     class: "h-{N}" }
    - { sx: "minWidth: N",   class: "min-w-[{N}px]" }
    - { sx: "minHeight: N",  class: "min-h-[{N}px]" }
    - { sx: "maxWidth: N",   class: "max-w-[{N}px]" }

    # Shape / Elevation
    - { sx: "borderRadius: 0",  class: "rounded-none" }
    - { sx: "borderRadius: 1",  class: "rounded-(--md-sys-shape-corner-extra-small)" }
    - { sx: "borderRadius: 2",  class: "rounded-(--md-sys-shape-corner-small)" }
    - { sx: "borderRadius: 3",  class: "rounded-(--md-sys-shape-corner-medium)" }
    - { sx: "borderRadius: 4",  class: "rounded-(--md-sys-shape-corner-large)" }
    - { sx: "boxShadow: N",     class: "shadow-(--md-sys-elevation-level{N})" }
    - { sx: "border: '1px solid'", class: "border border-(--md-sys-color-outline-variant)" }

    # Position
    - { sx: "position: 'relative'", class: "relative" }
    - { sx: "position: 'absolute'", class: "absolute" }
    - { sx: "position: 'fixed'",    class: "fixed" }
    - { sx: "overflow: 'hidden'",   class: "overflow-hidden" }
    - { sx: "overflow: 'auto'",     class: "overflow-auto" }
    - { sx: "textAlign: 'center'",  class: "text-center" }

  fallback: "Leave sx={{ ...unmapped }} intact with // TODO comment when pattern unrecognized."

# ─────────────────────────────────────────────────────────────────────
# Files / globs to ignore
# ─────────────────────────────────────────────────────────────────────

ignore:
  - "node_modules/**"
  - ".next/**"
  - "dist/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  # Keep RichTextEditor untouched (mui-tiptap dep)
  - "src/components/ui/RichTextEditor.tsx"
  # DataGrid pages — handle manually or keep MUI X
  - "src/app/(admin)/admin/users/page.tsx"
  - "src/app/(public-parts)/parts/page.tsx"
