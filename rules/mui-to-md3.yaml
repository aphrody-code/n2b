      - { from: { arrow: true }, to: {} }
    sx-bridge: true

  - id: mui-linear-progress
    effort: trivial
    status: active
    from:
      package: "@mui/material"
      imports: [LinearProgress]
    to:
      package: "@md3-ui/core/linear-progress"
      imports: [LinearProgress]
    prop-transforms:
      - { from: { variant: determinate, value: any }, to: { value: "$1" } }
      - { from: { variant: indeterminate }, to: {} }
    sx-bridge: true

  - id: mui-divider
    effort: trivial
    status: active
    from:
      package: "@mui/material"
      imports: [Divider]
    to:
      package: "@md3-ui/core/divider"
      imports: [Divider]
    prop-transforms:
      - { from: { orientation: vertical }, to: { orientation: vertical } }
      - { from: { flexItem: true }, to: {} }
      - { from: { textAlign: center }, to: { labelPosition: center } }
    sx-bridge: true

  - id: mui-tabs
    effort: med
    status: active
    from:
      package: "@mui/material"
      imports: [Tabs, Tab]
    to:
      package: "@md3-ui/core/tabs"
      imports: [Tabs]
    prop-transforms:
      - { from: { value: any }, to: { value: "$1" } }
      - { from: { onChange: "fn(e,x)" }, to: { onValueChange: "(v) => fn(null, v)" } }
      - { from: { orientation: vertical }, to: { orientation: vertical } }
      - { from: { variant: scrollable }, to: { scrollable: true } }
    jsx-rewrite:
      - pattern: "<Tabs value={V} onChange={C}>{CH}</Tabs>"
        replacement: "<Tabs.Root value={V} onValueChange={(v) => C(null, v)}><Tabs.List>{CH}</Tabs.List></Tabs.Root>"
      - pattern: "<Tab label={L} value={V} />"
        replacement: "<Tabs.Tab value={V}>{L}</Tabs.Tab>"
    notes: "Structural change; manual review recommended."

  - id: mui-dialog
    effort: high
    status: active
    from:
      package: "@mui/material"
      imports: [Dialog, DialogTitle, DialogContent, DialogActions, DialogContentText]
    to:
      package: "@md3-ui/core/dialog"
      imports: [Dialog]
    prop-transforms:
      - { from: { open: any, onClose: "fn" }, to: { open: "$1", onOpenChange: "(o) => !o && fn()" } }
    jsx-rewrite:
      - pattern: |
          <Dialog open={O} onClose={C} fullWidth maxWidth={M}>
            <DialogTitle>{T}</DialogTitle>
            <DialogContent>{B}</DialogContent>
            <DialogActions>{A}</DialogActions>
          </Dialog>
        replacement: |
          <Dialog.Root open={O} onOpenChange={(o) => !o && C()}>
            <Dialog.Portal>
              <Dialog.Backdrop />
              <Dialog.Viewport>
                <Dialog.Popup className={`max-w-${M} w-full`}>
                  <Dialog.Title>{T}</Dialog.Title>
                  <div>{B}</div>
                  <div className="flex gap-2 justify-end">{A}</div>
                </Dialog.Popup>
              </Dialog.Viewport>
            </Dialog.Portal>
          </Dialog.Root>
    notes: "Structural change — preserve all children. JSX rewriter must handle case variations."

