      - { from: { size: large }, to: { size: lg } }
      - { from: { color: primary }, to: { variant: filled } }
      - { from: { color: secondary }, to: { variant: tonal } }
      - { from: { edge: any }, to: {} }
    sx-bridge: true

  - id: mui-tooltip
    effort: trivial
