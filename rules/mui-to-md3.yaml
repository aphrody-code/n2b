# MUI v9 → md3-ui codemod rules
# Consumed by `n2b mui-to-md3` (n2b-core/src/codemod/).
# Format spec: n2b-core/src/rules/mui_to_md3.rs (schema `MuiToMd3Rules`).
#
# Schema:
#   rules[]:
#     id: string                      unique rule identifier
#     effort: trivial|low|med|high
#     status: active|deferred|gap     # gap = md3 component needs to be created first
#     from:
#       package: "@mui/material" | "@mui/x-*" | "@mui/icons-material"
#       imports: [string, ...]        # named exports to match
#     to:
#       package: string | "NONE"      # NONE = remove import + rewrite JSX to <div>
#       imports: [string, ...]        # optional if package == NONE
#       subpath-per-import: bool      # true → rewrite `import {X}` into `import {X} from "@md3-ui/core/x-kebab"`
#     prop-transforms:
#       - from: { propName: value | "any" }
#         to:   { propName: value }   # `null` value removes prop
#     sx-bridge: true|false           # if true, convert `sx` prop to `className` (Tailwind best-effort)
#     jsx-rewrite:
#       pattern: string               # pseudo-JSX for structural rewrites
#       replacement: string
#     notes: string

version: 1
md3-ui-version: "^1.0.0"
generated: 2026-04-18

# ─────────────────────────────────────────────────────────────────────
# @mui/material — direct mappings
# ─────────────────────────────────────────────────────────────────────

rules:
  - id: mui-button
    effort: trivial
    status: active
    from:
      package: "@mui/material"
      imports: [Button]
    to:
      package: "@md3-ui/core/button"
      imports: [Button]
    prop-transforms:
      - { from: { variant: contained }, to: { variant: filled } }
      - { from: { variant: outlined }, to: { variant: outlined } }
      - { from: { variant: text }, to: { variant: text } }
      - { from: { color: primary }, to: {} }
      - { from: { color: secondary }, to: { variant: tonal } }
      - { from: { color: error }, to: { className: "text-(--md-sys-color-error)" } }
      - { from: { size: small }, to: { size: sm } }
      - { from: { size: medium }, to: {} }
      - { from: { size: large }, to: { size: lg } }
      - { from: { fullWidth: true }, to: { className: "w-full" } }
      - { from: { disableElevation: true }, to: {} }
      - { from: { disableRipple: true }, to: {} }
    sx-bridge: true
    notes: "startIcon/endIcon must be inlined as children — handled by JSX rewriter, not prop-transform."

  - id: mui-card
    effort: trivial
    status: active
    from:
      package: "@mui/material"
      imports: [Card, CardContent, CardHeader, CardActions, CardMedia, CardActionArea]
    to:
      package: "@md3-ui/core/card"
      imports: [Card, CardContent, CardHeader, CardActions, CardMedia, CardActionArea]
    prop-transforms:
      - { from: { variant: elevation }, to: { variant: elevated } }
      - { from: { variant: outlined }, to: { variant: outlined } }
    sx-bridge: true

  - id: mui-typography
    effort: trivial
    status: active
    from:
      package: "@mui/material"
      imports: [Typography]
    to:
      package: "@md3-ui/core/typography"
      imports: [Typography]
    prop-transforms:
      - { from: { variant: h1 }, to: { variant: display-large } }
      - { from: { variant: h2 }, to: { variant: display-medium } }
      - { from: { variant: h3 }, to: { variant: display-small } }
      - { from: { variant: h4 }, to: { variant: headline-large } }
      - { from: { variant: h5 }, to: { variant: headline-medium } }
      - { from: { variant: h6 }, to: { variant: headline-small } }
      - { from: { variant: subtitle1 }, to: { variant: title-large } }
      - { from: { variant: subtitle2 }, to: { variant: title-medium } }
      - { from: { variant: body1 }, to: { variant: body-large } }
      - { from: { variant: body2 }, to: { variant: body-medium } }
      - { from: { variant: caption }, to: { variant: body-small } }
      - { from: { variant: button }, to: { variant: label-large } }
      - { from: { variant: overline }, to: { variant: label-medium } }
      - { from: { component: any }, to: { as: "$1" } }
      - { from: { align: center }, to: { className: "text-center" } }
      - { from: { align: left }, to: { className: "text-left" } }
      - { from: { align: right }, to: { className: "text-right" } }
      - { from: { align: justify }, to: { className: "text-justify" } }
      - { from: { gutterBottom: true }, to: { className: "mb-4" } }
      - { from: { noWrap: true }, to: { className: "truncate" } }
      - { from: { paragraph: true }, to: { as: "p" } }
    sx-bridge: true

  - id: mui-chip
    effort: low
    status: active
    from:
      package: "@mui/material"
      imports: [Chip]
    to:
      package: "@md3-ui/core/chip"
      imports: [Chip]
    prop-transforms:
      - { from: { label: any }, to: { children: "$1" } }
      - { from: { variant: filled }, to: { variant: assist } }
      - { from: { variant: outlined }, to: { variant: filter } }
      - { from: { color: primary }, to: {} }
      - { from: { size: small }, to: { size: sm } }
      - { from: { onDelete: any }, to: { onRemove: "$1" } }
      - { from: { deleteIcon: any }, to: { removeIcon: "$1" } }
      - { from: { icon: any }, to: { leadingIcon: "$1" } }
      - { from: { avatar: any }, to: { leadingIcon: "$1" } }
    sx-bridge: true

  - id: mui-text-field
    effort: med
    status: active
    from:
      package: "@mui/material"
      imports: [TextField]
    to:
      package: "@md3-ui/core/text-field"
      imports: [TextField]
    prop-transforms:
      - { from: { variant: filled }, to: { variant: filled } }
      - { from: { variant: outlined }, to: { variant: outlined } }
      - { from: { variant: standard }, to: { variant: filled } }
      - { from: { size: small }, to: { density: compact } }
      - { from: { size: medium }, to: {} }
      - { from: { fullWidth: true }, to: { className: "w-full" } }
      - { from: { multiline: true }, to: { multiline: true } }
      - { from: { InputProps: any }, to: { slotProps: { input: "$1" } } }
      - { from: { InputLabelProps: any }, to: { slotProps: { label: "$1" } } }
    sx-bridge: true
    notes: "select=true should be rewritten to <Select> manually (flagged by JSX rewriter)."

  - id: mui-icon-button
    effort: trivial
    status: active
    from:
      package: "@mui/material"
      imports: [IconButton]
    to:
