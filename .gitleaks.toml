# SPDX-License-Identifier: Apache-2.0
# gitleaks config for n2b — consumed by .github/workflows/security.yml.
# Goal: catch any NEW secret OR re-introduction of the repo owner's personal
# info, without noise on known-public / third-party / vendored false positives.
# Modelled on the sibling aphrody monorepo's config.

[extend]
useDefault = true

# --- Custom rule: owner PII must never be committed (anonymise) --------------
# Backstop for the 2026-06-04 privacy scrub: fail CI if the owner's real name,
# personal email, or per-user Windows path is reintroduced anywhere.
[[rules]]
id = "n2b-owner-pii"
description = "Repo owner personal name / email / home path (anonymise to neutral placeholders)"
regex = '''(?i)(yohanpierre[0-9]*@gmail\.com|yohanpierre-[0-9]+|\byohan\b|[\\/]Users[\\/]yohan)'''
tags = ["pii", "anonymisation"]
keywords = ["yohan"]

[allowlist]
description = "Known false positives — public-by-design, third-party, vendored, or generated"
paths = [
  # Lockfiles & dependency manifests (hashes look like secrets to gitleaks)
  '''Cargo\.lock$''',
  '''bun\.lock$''',
  '''.*\.lock$''',
  # Templates / samples / examples are placeholders by design
  '''.*\.example$''',
  '''.*\.sample$''',
  '''.*\.example\..*''',
  # Test fixtures and baselines may embed dummy tokens/snippets
  '''tests/fixture/''',
  '''tests/.*baseline.*''',
  '''tests/snapshots/''',
  # Vendored / third-party doc corpora (scraped Bun docs may embed sample keys)
  '''docs/bun-official/''',
]
# Allow the SPDX/placeholder e-mails we deliberately ship.
regexes = [
  '''owner@example\.com''',
  '''user@example\.com''',
  '''dev@aphrody''',
  '''security@aphrody\.dev''',
  '''conduct@aphrody-code\.dev''',
  '''noreply@anthropic\.com''',
  '''aphrody-code@users\.noreply\.github\.com''',
  '''<user>''',
]
stopwords = [
  "example",
  "placeholder",
  "redacted",
]
