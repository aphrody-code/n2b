[package]
name = "n2b"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "n2b"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
anyhow = "1"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
regex = "1"
once_cell = "1"
ignore = "0.4"
globset = "0.4"
rayon = "1"
memchr = "2"
similar = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
octocrab = "0.49"
futures = "0.3"
# fastembed : feature `ai` optionnelle — énorme (model ONNX + tokenizers
# + hf-hub + image + png) → +100 deps, +15 MB binaire. Désactivé par défaut
# depuis v0.3 ; `cargo install n2b --features ai` pour activer crosslink ML.
fastembed = { version = "5", optional = true }
# AST parser JS/TS (remplacement de la regex IMPORT_RE pour node-imports).
# oxc publie des versions cohérentes ensemble — pas de version hell.
oxc_allocator = "0.126"
oxc_parser = "0.126"
oxc_ast = "0.126"
oxc_ast_visit = "0.126"
oxc_span = "0.126"
# Sous-commande `n2b llmstxt` (migré depuis le crate llmstxt-rs).
url = "2"
walkdir = "2"
which = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[features]
default = []
# Active le crosslink ML dans `n2b analyze` (fastembed + AllMiniLML6V2).
ai = ["dep:fastembed"]

